[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  SECRETS_SCAN_OMIT_KEYS = "RESEND_API_KEY,GUIDE_FROM,CAL_API_KEY"
  SECRETS_SCAN_OMIT_PATHS = "**/*.pdf,**/*.mp4,public/**,dist/**"

[[redirects]]
  from = "/api/send-guide"
  to = "/.netlify/functions/send-guide"
  status = 200

[[redirects]]
  from = "/api/cal-slots"
  to = "/.netlify/functions/cal-slots"
  status = 200

[[redirects]]
  from = "/api/cal-book"
  to = "/.netlify/functions/cal-book"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
